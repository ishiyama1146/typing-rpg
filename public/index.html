<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TYPE RAID - 2人協力タイピングRPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="lobby" class="panel lobby">
    <div class="logo">TYPE <span>RAID</span></div>
    <p class="sub">2人協力・日本語ローマ字タイピングRPG</p>
    <input id="name" maxlength="12" placeholder="プレイヤー名">
    <button id="create">部屋を作る</button>
    <div class="or">または</div>
    <div class="joinrow"><input id="roomInput" maxlength="4" placeholder="4桁の部屋番号"><button id="join">参加</button></div>
    <p id="error"></p>
  </section>

  <main id="game" class="hidden">
    <header><div class="logo small">TYPE <span>RAID</span></div><div>ROOM <b id="roomCode"></b></div></header>
    <section class="boss panel">
      <div class="bossIcon">👹</div>
      <div class="bossName">紅蓮のタイピング鬼</div>
      <div class="bar bossbar"><i id="bossBar"></i></div>
      <div id="bossHp"></div>
      <div id="floatDamage"></div>
    </section>

    <section id="waiting" class="panel center">
      <h2>相方を待っています...</h2>
      <p>部屋番号 <strong id="shareCode"></strong> を友達に教えてね</p>
      <button id="start" disabled>2人揃ったらスタート</button>
    </section>

    <section id="battle" class="hidden">
      <div class="players">
        <div class="panel player"><b id="p1name">PLAYER 1</b><div class="bar"><i id="p1bar"></i></div><span id="p1hp"></span></div>
        <div class="panel player"><b id="p2name">PLAYER 2</b><div class="bar"><i id="p2bar"></i></div><span id="p2hp"></span></div>
      </div>

      <section class="typing panel">
        <div id="jp">準備...</div>
        <div id="romaji"></div>
        <div class="stats"><span>🔥 COMBO <b id="combo">0</b></span><span>⚔ DAMAGE <b id="myDamage">0</b></span></div>
        <div id="message">タイピングで攻撃！</div>
        <button id="heal">❤️ 全体回復（30 HIT消費）</button>
      </section>
    </section>

    <section id="result" class="panel hidden center">
      <h1 id="resultTitle"></h1>
      <div id="resultStats"></div>
      <button onclick="location.reload()">もう一度</button>
    </section>
  </main>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
